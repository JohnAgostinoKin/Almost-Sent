<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>almost sent.</title>
  <style>
    :root { --bg:#070707; --fg:#f4f1ea; --mute:#8a857c; --line:#242424; --red:#e23b2f; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:var(--bg); color:var(--fg); }
    body { font-family:Georgia,"Times New Roman",serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12vh 24px 64px; }
    main { width:100%; max-width:440px; }
    @media (min-width:800px) { main, footer, .examples { max-width:560px; } h1 { font-size:80px; } .draft { font-size:34px; } }
    h1 { font-weight:400; font-size:clamp(42px,10vw,64px); letter-spacing:-0.02em; line-height:0.95; text-wrap:balance; }
    .tag, .label, footer, .ex, button, textarea { font-family:ui-sans-serif,system-ui,sans-serif; }
    .tag { margin-top:16px; color:var(--mute); font-size:13px; line-height:1.5; }
    form, .result { margin-top:32px; }
    textarea, button { font:inherit; width:100%; }
    textarea { background:#101010; color:var(--fg); border:1px solid #2a2a2a; min-height:88px; padding:14px; resize:vertical; font-size:16px; line-height:1.5; }
    textarea:focus, button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
    textarea[readonly] { color:var(--mute); }
    .row { display:flex; gap:10px; margin-top:10px; }
    button { border:0; background:var(--red); color:#fff; padding:15px; font-size:14px; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:wait; }
    .ghost { background:transparent; color:var(--mute); border:1px solid #2a2a2a; }
    .ghost:hover { color:var(--fg); border-color:#3d3d3d; }
    .hint { margin-top:12px; font-size:11px; color:#5d5a54; }
    .label { display:block; font-size:11px; letter-spacing:0.06em; color:var(--mute); margin-bottom:8px; }
    .draft { font-size:27px; line-height:1.3; margin:0; text-wrap:pretty; }
    .swap { margin-top:14px; }
    .swap button { width:auto; padding:7px 13px; font-size:12px; }
    .turn { margin-top:34px; padding-top:26px; border-top:1px solid #1c1c1c; }
    .turn .label { margin-top:0; }
    #write { min-height:76px; margin-top:8px; }
    .actions { display:flex; gap:8px; margin-top:14px; }
    .actions button { padding:12px; font-size:13px; }
    .whew { margin-top:22px; font-size:12px; letter-spacing:0.1em; color:var(--red); }
    footer { margin-top:auto; padding-top:80px; color:#4a4742; font-size:11px; max-width:440px; width:100%; line-height:1.7; }
    .examples { margin-top:72px; width:100%; max-width:440px; }
    .ex { border-top:1px solid var(--line); padding:20px 0; color:#9a948a; font-size:14px; }
    .ex b { color:#d8d2c8; font-weight:400; }
    .hidden { display:none; }
    @media (prefers-reduced-motion:no-preference) {
      .draft { animation:rise .22s ease-out; }
      @keyframes rise { from { opacity:0; transform:translateY(5px); } }
    }
  </style>
</head>
<body>
  <main>
    <h1>almost sent.</h1>
    <p class="tag">the draft they never sent.</p>

    <form id="form">
      <label class="label" for="sent">tell us what they sent</label>
      <textarea id="sent" maxlength="500" placeholder="paste the most infuriating thing anyone sent you this week" required></textarea>
      <div class="row"><button id="go" type="submit">here's what they almost sent</button></div>
      <p class="hint">it does not open their phone.</p>
    </form>

    <section id="out" class="result hidden">
      <p class="draft" id="out-draft"></p>
      <div class="swap"><button class="ghost" type="button" id="another">another</button></div>

      <div class="turn">
        <label class="label" for="write">what say you</label>
        <textarea id="write" maxlength="180" placeholder="say it."></textarea>
        <div class="actions">
          <button class="ghost" type="button" id="share" disabled>send it to someone</button>
          <button class="ghost" type="button" id="again">new text</button>
        </div>
        <p class="whew hidden" id="whew">whew.</p>
      </div>
    </section>
  </main>

  <section class="examples" id="examples">
    <div class="ex"><b>sounds good</b> → what a load of crap</div>
    <div class="ex"><b>made it home</b> → you live next door</div>
    <div class="ex"><b>k</b> → l</div>
  </section>

  <footer>we keep the incoming line so we can write a better draft. we do not keep your reply or your name. 18+ only. almostsent.app</footer>

  <script>
    var go = document.getElementById("go");
    var sentEl = document.getElementById("sent");
    var draftEl = document.getElementById("out-draft");
    var writeEl = document.getElementById("write");
    var shareBtn = document.getElementById("share");
    var anotherBtn = document.getElementById("another");
    var whewEl = document.getElementById("whew");

    var pool = [];       // the (up to) six drafts from this call, ranked strongest first
    var cursor = 0;      // which one is on screen
    var reveals = 0;     // "another" clicks used on this result, capped below
    var MAX_REVEALS = 2; // two free reveals past the first — three lines, total
    var current = "";    // the input this result belongs to

    // "another" reveals the next-ranked line while there's one left to
    // reveal and the free-reveal cap isn't hit; once either runs out the
    // button turns into "new text" instead of dangling as a dead end.
    function refreshAnotherLabel() {
      var canReveal = reveals < MAX_REVEALS && cursor + 1 < pool.length;
      anotherBtn.textContent = canReveal ? "another" : "new text";
    }

    function reset() {
      document.getElementById("out").classList.add("hidden");
      document.getElementById("examples").classList.remove("hidden");
      sentEl.value = "";
      sentEl.readOnly = false;
      writeEl.value = "";
      shareBtn.disabled = true;
      shareBtn.textContent = "send it to someone";
      whewEl.classList.add("hidden");
      pool = [];
      cursor = 0;
      reveals = 0;
      anotherBtn.textContent = "another";
      sentEl.focus();
    }

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var sent = sentEl.value.trim();
      if (!sent || go.disabled) return;
      go.disabled = true;
      go.textContent = "typing…";
      try {
        var res = await fetch("/api/draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sent: sent })
        });
        var data = await res.json();

        pool = (data.refuse || !data.drafts || !data.drafts.length)
          ? ["even the draft wouldn't send that"]
          : data.drafts;

        current = sent;
        cursor = 0;
        reveals = 0;
        draftEl.textContent = pool[0];
        refreshAnotherLabel();
        sentEl.readOnly = true;
        writeEl.value = "";
        shareBtn.disabled = true;
        whewEl.classList.add("hidden");
        document.getElementById("out").classList.remove("hidden");
        document.getElementById("examples").classList.add("hidden");
        writeEl.focus({ preventScroll: true });
      } catch (err) {
        alert("the draft didn't come through. try again.");
      } finally {
        go.disabled = false;
        go.textContent = "here's what they almost sent";
      }
    });

    anotherBtn.addEventListener("click", function () {
      if (reveals < MAX_REVEALS && cursor + 1 < pool.length) {
        cursor++;
        reveals++;
        draftEl.textContent = pool[cursor];
        refreshAnotherLabel();
      } else {
        reset();
      }
    });

    writeEl.addEventListener("input", function () {
      shareBtn.disabled = writeEl.value.trim().length === 0;
    });

    shareBtn.addEventListener("click", async function () {
      var mine = writeEl.value.trim();
      if (!mine) return;
      var text =
        "they sent: " + current + "\n" +
        "they almost sent: " + draftEl.textContent + "\n" +
        "i almost sent: " + mine + "\n\n" +
        "almostsent.app";
      whewEl.classList.remove("hidden");
      try {
        if (navigator.share) {
          await navigator.share({ text: text });
        } else {
          await navigator.clipboard.writeText(text);
          shareBtn.textContent = "copied. go paste it";
        }
      } catch (err) { /* user dismissed the sheet */ }
    });

    document.getElementById("again").addEventListener("click", reset);
  </script>
</body>
</html>
