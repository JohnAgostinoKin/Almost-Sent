<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>almost sent.</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-title" content="almost sent.">
  <meta property="og:title" content="almost sent.">
  <meta property="og:description" content="paste what they sent. see what they almost sent.">
  <meta property="og:image" content="https://almostsent.app/og.png">
  <meta property="og:url" content="https://almostsent.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="almost sent.">
  <meta name="twitter:description" content="paste what they sent. see what they almost sent.">
  <meta name="twitter:image" content="https://almostsent.app/og.png">
  <style>
    :root { --bg:#070707; --fg:#f4f1ea; --mute:#b3ada2; --line:#242424; --red:#e23b2f; }
    .dot { color:var(--red); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:var(--bg); color:var(--fg); }
    body { font-family:Georgia,"Times New Roman",serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12vh 24px 64px; }
    main { width:100%; max-width:440px; }
    @media (min-width:800px) { main, footer { max-width:560px; } h1 { font-size:80px; } .draft { font-size:38px; } }
    h1 { font-weight:400; font-size:clamp(42px,10vw,64px); letter-spacing:-0.02em; line-height:0.95; text-wrap:balance; }
    .tag, .label, footer, button, textarea { font-family:ui-sans-serif,system-ui,sans-serif; }
    .tag { margin-top:16px; color:var(--mute); font-size:13px; line-height:1.5; }
    form, .result { margin-top:32px; }
    textarea, button { font:inherit; width:100%; }
    textarea { background:#101010; color:var(--fg); border:1px solid #2a2a2a; min-height:88px; padding:14px; resize:vertical; font-size:18px; line-height:1.5; }
    textarea:focus, button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
    textarea[readonly] { color:var(--mute); }
    textarea::placeholder { color:var(--mute); opacity:1; font-size:14px; }
    .row { display:flex; gap:10px; margin-top:10px; }
    button { border:0; background:var(--red); color:#fff; padding:15px; font-size:16px; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:wait; }
    .ghost { background:transparent; color:var(--mute); border:1px solid #2a2a2a; }
    .ghost:hover { color:var(--fg); border-color:#3d3d3d; }
    .hint { margin-top:12px; font-size:10px; color:#6e6960; }
    .chips { display:flex; flex-wrap:nowrap; align-items:center; overflow-x:auto; gap:6px; margin-top:10px; -webkit-overflow-scrolling:touch; }
    .chips-lead { flex-shrink:0; font-family:ui-sans-serif,system-ui,sans-serif; font-size:10px; color:#6e6960; }
    .chip { flex-shrink:0; width:auto; background:transparent; color:#8a857c; border:1px solid #1c1c1c; border-radius:999px; padding:4px 10px; font-size:10px; }
    .chip:hover { color:var(--fg); border-color:#3d3d3d; }
    .label { display:block; font-size:13px; letter-spacing:0.06em; color:var(--mute); margin-bottom:8px; }
    .draft { font-size:30px; line-height:1.3; margin:0; text-wrap:pretty; }
    .draft .sent-part { color:var(--mute); }
    .crisis-msg { font-size:17px; line-height:1.6; margin:0; }
    .crisis-msg a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
    /* Everything below the message is joke-app chrome — reactions, share,
       reroll, "write your own" — none of it belongs next to a crisis
       response. See index.html's submit handler for when this gets set. */
    #out.crisis-mode #out-draft,
    #out.crisis-mode .react,
    #out.crisis-mode #lead-actions,
    #out.crisis-mode #save-image-row,
    #out.crisis-mode .worse,
    #out.crisis-mode #beat-toggle,
    #out.crisis-mode .turn { display:none; }
    .react { display:flex; gap:8px; margin-top:16px; }
    .react button { width:auto; padding:8px 13px; font-size:20px; line-height:1; background:transparent; border:1px solid #2a2a2a; color:var(--fg); }
    .react button:hover:not(:disabled) { border-color:#3d3d3d; }
    .react button:disabled { opacity:0.3; cursor:default; }
    .react button.picked { opacity:1; border-color:var(--red); }
    .debug { margin-top:8px; font-size:11px; color:#6e6960; }
    .debug ul { margin-top:6px; padding-left:16px; }
    .debug li { margin-top:2px; }
    .debug li.dropped { color:#8a4a42; }
    .minor { margin-top:14px; }
    .minor button { width:auto; padding:7px 13px; font-size:12px; }
    .beat-toggle { display:block; width:auto; background:transparent; border:0; padding:0; margin-top:18px; color:var(--mute); font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
    .beat-toggle:hover { color:var(--fg); }
    .turn { margin-top:34px; padding-top:26px; border-top:1px solid #1c1c1c; }
    .turn .label { margin-top:0; }
    .sent-context { margin-bottom:10px; font-size:15px; line-height:1.5; color:var(--mute); }
    #write { min-height:76px; margin-top:8px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .actions button { width:auto; padding:12px 14px; font-size:13px; }
    .whew { margin-top:22px; font-size:12px; letter-spacing:0.1em; color:var(--red); }
    footer { margin-top:auto; padding-top:80px; color:#6e6960; font-size:13px; max-width:440px; width:100%; line-height:1.7; }
    footer a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
    footer a:hover { color:var(--fg); }
    .hidden { display:none; }
    @media (prefers-reduced-motion:no-preference) {
      .draft { animation:rise .22s ease-out; }
      @keyframes rise { from { opacity:0; transform:translateY(5px); } }
    }
  </style>
</head>
<body>
  <main>
    <h1>almost sent<span class="dot">.</span></h1>
    <p class="tag">you think you know them.</p>

    <form id="form">
      <label class="label" for="sent">tell us what they sent</label>
      <textarea id="sent" maxlength="500" required placeholder="type what they sent"></textarea>
      <div class="chips" id="chips">
        <span class="chips-lead">try:</span>
        <button class="chip" type="button">sorry, i fell asleep</button>
        <button class="chip" type="button">we should hang out sometime</button>
        <button class="chip" type="button">i'm fine</button>
        <button class="chip" type="button">who is she?</button>
      </div>
      <div class="row"><button id="go" type="submit">here's what they almost sent</button></div>
      <p class="hint">made up. nothing gets sent.</p>
    </form>

    <section id="out" class="result hidden">
      <p class="draft" id="out-draft"></p>
      <!-- Shown instead of #out-draft, with everything else in this
           section hidden (see #out.crisis-mode below), when the server's
           crisis pre-check (lib/crisis.js) flags the pasted text — a
           plain, serious line, not a joke that just failed to generate. -->
      <p class="crisis-msg hidden" id="crisis-msg"></p>
      <div class="react" id="react">
        <button type="button" data-value="hit" aria-label="nailed it" title="nailed it">😂</button>
        <button type="button" data-value="meh" aria-label="meh" title="meh">😐</button>
        <button type="button" data-value="far" aria-label="too far" title="too far">😬</button>
      </div>
      <!-- Reroll is the primary action now — a full-width, primary-styled
           button directly under the reactions (default button styling: red,
           full width, same as #go — no .ghost here on purpose), not a small
           ghost tucked below the share row. It never dead-ends: once the
           current batch of alternates is exhausted, a click fetches a fresh
           n=4 batch instead of just disabling — see fetchMoreAlternates and
           the click handler below. Capped at MAX_ALTERNATE_FETCHES batches
           per result, then it disables for real. -->
      <div class="row worse"><button type="button" id="another" disabled>make it worse</button></div>

      <div class="debug hidden" id="debug"></div>

      <!-- Sharing the AI line is the obvious next step, so this row sits
           right under the draft, the reactions, and the reroll button — not
           buried below the "write your own" box. The same three buttons (by
           class, not id — see the script) appear again in .turn below for
           whoever scrolls down to write their own line; both rows call
           buildShareText(). -->
      <div class="actions" id="lead-actions">
        <button class="ghost text-share" type="button" disabled>text it</button>
        <button class="ghost email-share" type="button" disabled>email it</button>
        <button class="ghost copy-share" type="button" disabled>copy it</button>
      </div>
      <!-- A 9:16 PNG drawn on canvas (see drawShareCanvas in the script) —
           not a screenshot. Enabled/disabled in lockstep with the three
           buttons above (see setShareDisabled). -->
      <div class="row" id="save-image-row"><button class="ghost" type="button" id="save-image" disabled>save as image</button></div>
      <!-- "new text" is the minor action now — a small ghost link after the
           share row, so it no longer competes with reroll for attention. -->
      <div class="minor"><button class="ghost" type="button" id="again">new text</button></div>

      <!-- "think you can do better" used to sit open on the page, competing
           with the result itself and confusing first-timers. Collapsed now
           — nothing about it visible until this link is tapped, which
           reveals .turn (the box and its own share row) and logs beat_open
           once (see the click handler below). -->
      <button class="beat-toggle" type="button" id="beat-toggle">think you can do better? beat the ai &rarr;</button>

      <div class="turn hidden" id="turn">
        <label class="label" for="write">think you can do better? show us.</label>
        <p class="sent-context" id="sent-context"></p>
        <textarea id="write" maxlength="180" placeholder="finish it."></textarea>
        <div class="actions">
          <button class="ghost text-share" type="button" disabled>text it</button>
          <button class="ghost email-share" type="button" disabled>email it</button>
          <button class="ghost copy-share" type="button" disabled>copy it</button>
        </div>
        <p class="whew hidden" id="whew">whew.</p>
      </div>
    </section>
  </main>

  <footer>your text is used to make the draft and deleted after 30 days. don't paste names, numbers, or private details. 18+. <a href="/privacy">privacy</a></footer>

  <script>
    var go = document.getElementById("go");
    var sentEl = document.getElementById("sent");
    var draftEl = document.getElementById("out-draft");
    var crisisMsgEl = document.getElementById("crisis-msg");
    var outEl = document.getElementById("out");
    var writeEl = document.getElementById("write");
    // Two copies of each share button on the page now (see the #out
    // section — one under the draft, one under the "write your own" box),
    // matched by class rather than id since ids have to be unique. Every
    // place that used to touch the single textShareBtn/etc. element now
    // loops over the pair.
    var textShareBtns = Array.prototype.slice.call(document.querySelectorAll(".text-share"));
    var emailShareBtns = Array.prototype.slice.call(document.querySelectorAll(".email-share"));
    var copyShareBtns = Array.prototype.slice.call(document.querySelectorAll(".copy-share"));
    var saveImageBtn = document.getElementById("save-image");
    var anotherBtn = document.getElementById("another");
    var whewEl = document.getElementById("whew");
    var debugEl = document.getElementById("debug");
    var sentContextEl = document.getElementById("sent-context");
    var turnEl = document.getElementById("turn");
    var beatToggleEl = document.getElementById("beat-toggle");
    var reactEl = document.getElementById("react");
    var reactButtons = Array.prototype.slice.call(reactEl.querySelectorAll("button"));
    var chipsEl = document.getElementById("chips");

    // Tap a chip to fill #sent with that example — doesn't submit, just
    // saves typing (or gives someone with a blank mind somewhere to start).
    chipsEl.addEventListener("click", function (e) {
      var chip = e.target.closest(".chip");
      if (!chip) return;
      sentEl.value = chip.textContent;
      sentEl.focus();
    });

    // Mirrors lib/postprocess.js's OPENER_RE and lib/compose.js's
    // composeDraft (duplicated — no build step here to require() them,
    // keep the two in sync by hand): a real continuation always opens with
    // the punctuation or space that connects it to the sent text, so the
    // draft is rendered as two tones — the sent text muted, the
    // continuation not, same line, no added space (the continuation
    // already carries its own leading connector). If the sent text also
    // ends in its own punctuation, a leading period or comma on the
    // continuation is dropped rather than doubled up ("we good?." reads
    // as a typo, not a joke). A line that doesn't open with a connector at
    // all is a straight replacement, not a continuation, so it renders
    // alone with no muted prefix.
    var OPENER_RE = /^[,.!?\s]/;
    var SENT_END_PUNCT_RE = /[.,!?]$/;
    var LEADING_DOT_COMMA_RE = /^[.,]/;
    // draftText must already be the .text string off a {shape, text} draft
    // (see pool below) — never the whole object. Coercing a non-string
    // (typeof guard, not String(x)||"") is deliberate: String() on an
    // object silently renders "[object Object]" instead of failing loudly,
    // which is exactly how that bug used to reach the screen; an unexpected
    // non-string here now renders as nothing instead.
    //
    // Returns [{text, muted}] — one or two parts, muted:true for the
    // sent-text portion, false for the continuation. Both renderDraft (the
    // on-page DOM) and drawShareCanvas (the shared-image canvas, further
    // down) build off this exact split, so the two never drift on where
    // the color actually switches.
    function composeParts(sentText, draftText) {
      var text = typeof draftText === "string" ? draftText : "";
      if (OPENER_RE.test(text)) {
        if (SENT_END_PUNCT_RE.test(sentText) && LEADING_DOT_COMMA_RE.test(text)) {
          text = text.slice(1);
        }
        return [{ text: sentText, muted: true }, { text: text, muted: false }];
      }
      return [{ text: text, muted: false }];
    }

    function renderDraft(sentText, draftText) {
      draftEl.textContent = "";
      composeParts(sentText, draftText).forEach(function (part) {
        if (part.muted) {
          var sentPart = document.createElement("span");
          sentPart.className = "sent-part";
          sentPart.textContent = part.text;
          draftEl.appendChild(sentPart);
        } else {
          draftEl.appendChild(document.createTextNode(part.text));
        }
      });
    }

    // ?debug=1 shows the response's source/why/provider under the draft,
    // plus every line the model wrote this call — shape-tagged, and marked
    // which were dropped and by which filter (data.debug, from
    // lib/postprocess.js's filterLines via api/draft.js) — never rendered
    // for a normal visitor, the param has to be there.
    var DEBUG = new URLSearchParams(location.search).get("debug") === "1";

    // Two requests per result now (the lead, then the alternates — see the
    // submit handler below), each with its own response to show. Appends a
    // labeled block per call instead of replacing debugEl's content, so the
    // lead's block is still there once the alternates block lands after it.
    // reset() (see below) is what actually clears debugEl between results —
    // this never has to, since a fresh submit is only ever reachable after
    // reset() ran (the form is read-only until then).
    function renderDebug(label, data) {
      var block = document.createElement("div");
      var summary = document.createElement("div");
      summary.textContent =
        label + " — source: " + (data.source || "—") +
        " · why: " + (data.why || "—") +
        " · provider: " + (data.provider || "—") +
        " · logged: " + (data.logged || "—") +
        " · t_gen: " + (data.t_gen != null ? data.t_gen + "ms" : "—") +
        " · t_judge: " + (data.t_judge != null ? data.t_judge + "ms" : "—") +
        " · t_total: " + (data.t_total != null ? data.t_total + "ms" : "—");
      block.appendChild(summary);
      if (data.debug && data.debug.length) {
        var list = document.createElement("ul");
        data.debug.forEach(function (d) {
          var li = document.createElement("li");
          li.textContent = "[" + (d.shape || "?") + "] " +
            (d.dropped ? "dropped (" + (d.filter || "?") + ")" : "kept") +
            " — " + (typeof d.text === "string" ? d.text : "(non-text)");
          if (d.dropped) li.className = "dropped";
          list.appendChild(li);
        });
        block.appendChild(list);
      }
      debugEl.appendChild(block);
      debugEl.classList.remove("hidden");
    }

    // Fire-and-forget anonymous event log — device id, event name, and a
    // small meta object only. Never the text itself (that's already in the
    // inbox table, on its own, via api/draft.js). Never blocks or throws
    // into the UI. deviceId defaults to DEVICE_ID but can be overridden —
    // needed once, below, to log "arrival" against a brand-new id before
    // that id is assigned to DEVICE_ID itself.
    function logEvent(event, meta, deviceId) {
      var id = deviceId || DEVICE_ID;
      if (!id) return;
      try {
        fetch("/api/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: id, event: event, meta: meta || {} })
        }).catch(function () {});
      } catch (err) {}
    }

    // A random id stored on this device on first visit — no personal data,
    // nothing tied to an identity, never sent anywhere but /api/event. If
    // this is a first visit (no id stored yet) AND the page was loaded via
    // a referral link (?r=<the referrer's device_id> — see the share block
    // below, which appends it to almostsent.app), log that as an "arrival"
    // event with the referrer's code, before this device's own id is
    // written to localStorage.
    //
    // localStorage reads and writes are each wrapped separately: a device
    // with storage blocked entirely (private mode, cookies-off, etc.) still
    // gets an id generated below and returned — it just can't be persisted,
    // so this falls back to a fresh in-memory id every reload instead of
    // going all the way to null. That matters because DEVICE_ID feeds every
    // share link's ?r= param (see buildShareText below); returning null here
    // used to mean a storage-blocked visitor's shares silently carried no
    // referral code at all, for the entire session, with no way to notice.
    function getDeviceId() {
      var id = null;
      try {
        id = localStorage.getItem("device_id");
      } catch (err) {
        id = null; // storage blocked — fall through to the in-memory id below
      }
      if (id) return id;

      id = (crypto.randomUUID && crypto.randomUUID()) ||
        (Date.now().toString(36) + Math.random().toString(36).slice(2));
      var ref = new URLSearchParams(location.search).get("r");
      if (ref) logEvent("arrival", { ref: ref }, id);
      try {
        localStorage.setItem("device_id", id);
      } catch (err) {
        // storage blocked — id still works for every share this page load,
        // it just won't survive a reload.
      }
      return id;
    }
    var DEVICE_ID = getDeviceId();

    // Which shape leads used to rotate server-side, one active shape at a
    // time, per api/draft.js request — meaningless once generation split
    // into two requests (see the submit handler below): the lead shape now
    // has to be decided BEFORE either request goes out, since the n=1 call
    // needs it and the n=4 call needs to exclude it. So the rotation moved
    // here, to the device. Mirrors lib/prompt.js's ACTIVE_SHAPES — keep the
    // two in sync by hand, same as OPENER_RE elsewhere on this page.
    //
    // Same storage-blocked tolerance as getDeviceId() above: a read or
    // write that throws falls back to memoryLeadIndex, so rotation still
    // advances correctly for the rest of this page load — it just won't
    // survive a reload if storage is unavailable.
    var SHAPES = ["shock", "raunchy", "deranged", "gross"];
    var memoryLeadIndex = -1;
    function nextLeadShape() {
      var idx = memoryLeadIndex;
      try {
        var stored = localStorage.getItem("lead_rotation");
        if (stored !== null) {
          var parsed = parseInt(stored, 10);
          if (!isNaN(parsed)) idx = parsed;
        }
      } catch (err) { /* storage blocked — idx stays memoryLeadIndex */ }
      idx = (idx + 1) % SHAPES.length;
      memoryLeadIndex = idx;
      try {
        localStorage.setItem("lead_rotation", String(idx));
      } catch (err) { /* storage blocked — memoryLeadIndex above still works this page load */ }
      return SHAPES[idx];
    }

    var pool = [];       // the {shape, text} drafts for this result: the lead (from the n=1
                          // call), then alternates (from n=4 calls, appended as they land —
                          // see fetchMoreAlternates below), in display order
    var cursor = 0;      // which one is on screen
    var current = "";    // the input this result belongs to
    var currentSource = null;   // this result's data.source, reused in later draft_shown/another logs
    var currentProvider = null; // this result's data.provider, same reuse
    var currentShape = null;    // pool[cursor]'s shape, read by the reaction buttons below
    var currentLeadShape = null; // the shape the lead call used — every alternates fetch for
                                  // this result (the automatic first one and any "make it
                                  // worse"-triggered refetch) excludes the same shape.
    var alternatesAllowed = false; // false for a refusal — never fetch alternates for one (set
                                    // alongside currentSource/currentProvider below)
    var alternateFetches = 0;      // n=4 batches fetched for this result so far — logged as
                                    // meta.fetch on every "another" event, so how many people
                                    // click deep into fetch 2 or 3 is visible later.
    var MAX_ALTERNATE_FETCHES = 3; // "make it worse" never dead-ends into a disabled button on
                                    // its own — it fetches a fresh batch instead — until this
                                    // many batches have been asked for, then it disables for real.
    var fetchingAlternates = false; // true for the life of any n=4 call — guards against a
                                     // double-click firing two overlapping fetches.
    var ownLineLogged = false;  // one own_line log per result, not one per keystroke
    var reacted = false;        // one reaction tap per draft shown, see resetReact()/reactButtons below
    var beatOpened = false;     // one beat_open log per result — see the toggle's click handler below

    // Enabled whenever there's still a line to reveal (its own or a fresh
    // fetch's worth), disabled while a fetch is in flight, and disabled for
    // good once alternates aren't allowed at all (a refusal) or the fetch
    // cap is spent — "reroll should never dead-end" on its own, so the only
    // real disable is the fetch cap; see the click handler below for what
    // happens on an exhausted-but-still-fetchable click.
    function refreshAnotherState() {
      if (fetchingAlternates) { anotherBtn.disabled = true; return; }
      var hasMore = cursor + 1 < pool.length;
      var canFetchMore = alternatesAllowed && alternateFetches < MAX_ALTERNATE_FETCHES;
      anotherBtn.disabled = !(hasMore || canFetchMore);
    }

    // Re-arms the 😂/😐/😬 row for a newly shown draft — one tap is allowed
    // per draft (see the click handler below), so every time a different
    // draft comes on screen (initial render or "another") the buttons need
    // to un-grey and drop whichever one was picked for the last draft.
    function resetReact() {
      reacted = false;
      reactButtons.forEach(function (b) { b.disabled = false; b.classList.remove("picked"); });
    }

    // Both share rows (top and under the "write your own" box) move
    // together — there's one shared state (enabled once a draft is up,
    // disabled between results), not two independent ones.
    function setShareDisabled(disabled) {
      textShareBtns.forEach(function (b) { b.disabled = disabled; });
      emailShareBtns.forEach(function (b) { b.disabled = disabled; });
      copyShareBtns.forEach(function (b) { b.disabled = disabled; });
      saveImageBtn.disabled = disabled;
    }
    // Only the "copy it" label resets here — the "copied." confirmation
    // (see copyShareBtns' click handler below) is per-button, scoped to
    // whichever one was actually clicked.
    function resetCopyLabel() {
      copyShareBtns.forEach(function (b) { b.textContent = "copy it"; });
    }

    function reset() {
      outEl.classList.add("hidden");
      outEl.classList.remove("crisis-mode");
      crisisMsgEl.classList.add("hidden");
      crisisMsgEl.textContent = "";
      sentEl.value = "";
      sentEl.readOnly = false;
      writeEl.value = "";
      setShareDisabled(true);
      resetCopyLabel();
      whewEl.classList.add("hidden");
      debugEl.textContent = "";
      debugEl.classList.add("hidden");
      sentContextEl.textContent = "";
      turnEl.classList.add("hidden");
      beatToggleEl.classList.remove("hidden");
      beatOpened = false;
      pool = [];
      cursor = 0;
      currentSource = null;
      currentProvider = null;
      currentShape = null;
      currentLeadShape = null;
      alternatesAllowed = false;
      alternateFetches = 0;
      fetchingAlternates = false;
      ownLineLogged = false;
      resetReact();
      anotherBtn.disabled = true;
      sentEl.focus();
    }

    // Rotates through in-voice lines on the submit button while a draft is
    // generating, instead of sitting on a single static "typing…". Restarts
    // from the first line every submit (startLoadingLines resets `i`), so a
    // quick "another"-then-"new text" round doesn't pick up mid-rotation.
    // Waits 600ms before the first line so a fast response never flashes a
    // loading line at all — the button just stays put — and once it does
    // start, holds each line 1500ms.
    var LOADING_LINES = [
      "reading between the lies…",
      "checking their deleted drafts…",
      "contacting their therapist…",
      "oh no.",
      "they absolutely cannot send this."
    ];
    var LOADING_START_DELAY_MS = 600;
    var LOADING_INTERVAL_MS = 1500;
    var loadingStartTimer = null;
    var loadingTimer = null;
    function startLoadingLines() {
      loadingStartTimer = setTimeout(function () {
        var i = 0;
        go.textContent = LOADING_LINES[i];
        loadingTimer = setInterval(function () {
          i = (i + 1) % LOADING_LINES.length;
          go.textContent = LOADING_LINES[i];
        }, LOADING_INTERVAL_MS);
      }, LOADING_START_DELAY_MS);
    }
    function stopLoadingLines() {
      if (loadingStartTimer) { clearTimeout(loadingStartTimer); loadingStartTimer = null; }
      if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; }
    }

    // One n=4 batch fetch — the automatic one right after the lead renders
    // is fetch #1, and any "make it worse" click past the end of the
    // current batch (see the click handler below) fetches another, up to
    // MAX_ALTERNATE_FETCHES. Increments alternateFetches itself (so the
    // caller doesn't have to remember to), and always resolves — a network
    // failure just leaves the pool where it was, counted against the fetch
    // cap same as a real attempt (still worth the cap either way, so a
    // consistently-failing draft call can't be retried forever).
    //
    // Fetch #1 is the normal batch, unescalated — the visitor hasn't asked
    // for worse yet, there's nothing to be worse than. Fetch #2 and #3 are
    // always a "make it worse" click past an exhausted batch (the only
    // caller of this function once fetch #1 is spent — see the click
    // handler below), so those pass escalate:true plus every line already
    // revealed for this result (pool up through cursor, read directly off
    // the closure rather than a param — see api/draft.js's handler and
    // lib/prompt.js's systemPrompt for what the server does with them).
    async function fetchMoreAlternates(sent, leadShape) {
      fetchingAlternates = true;
      alternateFetches++;
      var fetchNum = alternateFetches;
      var escalate = fetchNum >= 2;
      var reqBody = { sent: sent, n: 4, lead: leadShape };
      if (escalate) {
        reqBody.escalate = true;
        reqBody.shown = pool.slice(0, cursor + 1).map(function (d) { return d.text; });
      }
      try {
        var res = await fetch("/api/draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(reqBody)
        });
        var data = await res.json();
        // A "new text" click (or another submit) could land between firing
        // this and it resolving — `current` would have moved on by then.
        // Don't splice alternates for an old result onto a new one.
        if (sent !== current) return;
        if (data.drafts && data.drafts.length) pool = pool.concat(data.drafts);
        if (DEBUG) renderDebug("alternates " + fetchNum, data);
      } catch (err) {
        // pool unchanged this attempt — still counted against the fetch cap above.
      } finally {
        fetchingAlternates = false;
      }
    }

    // Fixed, not user-controlled — safe to set via innerHTML for the tel:/
    // sms: links, unlike anything derived from `sent`. Shown instead of a
    // draft when the server's crisis pre-check (lib/crisis.js) flags the
    // pasted text — see #out.crisis-mode's CSS and the submit handler below.
    var CRISIS_MESSAGE_HTML = "that sounded like more than a joke could help " +
      "with. if you need to talk to someone: <a href=\"tel:988\">call</a> or " +
      "<a href=\"sms:988\">text</a> 988 — the Suicide &amp; Crisis Lifeline (US), " +
      "free and available any time.";

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var sent = sentEl.value.trim();
      if (!sent || go.disabled) return;
      logEvent("paste");
      go.disabled = true;
      startLoadingLines();
      var leadShape = nextLeadShape();
      var gotLead = false;
      try {
        // The lead: one line, exactly this shape, judged, awaited — this is
        // the part the visitor is actually waiting on.
        var res = await fetch("/api/draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sent: sent, n: 1, lead: leadShape })
        });
        var data = await res.json();
        gotLead = true;

        if (data.crisis) {
          // No draft, no pool, no reactions, no share, no alternates call —
          // #out.crisis-mode's CSS hides all of that chrome, leaving just
          // the message and "new text" to get back to the form.
          current = sent;
          pool = [];
          cursor = 0;
          currentSource = null;
          currentProvider = null;
          currentShape = null;
          currentLeadShape = null;
          alternatesAllowed = false;
          alternateFetches = 0;
          turnEl.classList.add("hidden");
          beatToggleEl.classList.remove("hidden");
          beatOpened = false;
          resetReact();
          outEl.classList.add("crisis-mode");
          crisisMsgEl.innerHTML = CRISIS_MESSAGE_HTML;
          crisisMsgEl.classList.remove("hidden");
          sentContextEl.textContent = sent;
          logEvent("draft_shown", { source: "crisis", provider: null, revealIndex: 0 });
          // Which layer caught it — lib/block.js's synchronous keyword
          // regex or lib/crisis.js's semantic pre-check (see
          // api/draft.js's handler, which is what sets data.source) — so
          // the two can be counted separately.
          logEvent("crisis", { source: data.source || "model" });
          if (DEBUG) renderDebug("lead", data);
          sentEl.readOnly = true;
          writeEl.value = "";
          setShareDisabled(true);
          whewEl.classList.add("hidden");
          outEl.classList.remove("hidden");
          return;
        }

        // This bypasses the server's filterLines the same way lib/fallback.js's
        // STALL_LINES do — it's a fixed client-side string, never model
        // output — so it needs its own leading connector written in here
        // rather than relying on a fix that only ever runs server-side.
        pool = (data.refuse || !data.drafts || !data.drafts.length)
          ? [{ shape: "stall", text: ". even the draft wouldn't send that" }]
          : data.drafts;

        current = sent;
        cursor = 0;
        currentSource = data.source || null;
        currentProvider = data.provider || null;
        currentShape = pool[0].shape || null;
        currentLeadShape = leadShape;
        alternatesAllowed = !data.refuse;
        alternateFetches = 0;
        ownLineLogged = false;
        resetReact();
        renderDraft(sent, pool[0].text);
        sentContextEl.textContent = sent;
        // Nothing to reveal yet regardless of pool.length — the alternates
        // call kicked off below is what actually earns "make it worse" its
        // enabled state, via refreshAnotherState() once fetchMoreAlternates lands.
        anotherBtn.disabled = true;
        logEvent("draft_shown", { source: currentSource, provider: currentProvider, revealIndex: cursor });
        if (DEBUG) renderDebug("lead", data);
        sentEl.readOnly = true;
        writeEl.value = "";
        // Enabled the moment the draft is up, not gated on the visitor
        // typing anything into #write — buildShareText() below already
        // handles an empty #write by leaving "i almost sent" out.
        setShareDisabled(false);
        resetCopyLabel();
        whewEl.classList.add("hidden");
        outEl.classList.remove("hidden");
        writeEl.focus({ preventScroll: true });

        // A refusal is final — never ask for alternates to a refused input
        // (alternatesAllowed above is what keeps the click handler from
        // trying later too).
        if (!data.refuse) {
          fetchMoreAlternates(sent, leadShape).then(function () {
            if (sent !== current) return;
            refreshAnotherState();
          });
        }
      } catch (err) {
        if (!gotLead) alert("the draft didn't come through. try again.");
      } finally {
        // The lead answered (or failed) either way — this is the moment
        // #go stops looking busy, whether or not alternates ever show up.
        stopLoadingLines();
        go.disabled = false;
        go.textContent = "here's what they almost sent";
      }
    });

    anotherBtn.addEventListener("click", async function () {
      // Disabled once there's truly nothing left (see refreshAnotherState)
      // — a disabled button doesn't fire click events, so this guard is
      // just a defensive no-op, not a real fallback path.
      if (anotherBtn.disabled) return;

      // A line is already sitting in the pool — reveal it, no fetch needed.
      if (cursor + 1 < pool.length) {
        cursor++;
        currentShape = pool[cursor].shape || null;
        resetReact();
        renderDraft(current, pool[cursor].text);
        refreshAnotherState();
        logEvent("another", { source: currentSource, provider: currentProvider, revealIndex: cursor, fetch: alternateFetches });
        logEvent("draft_shown", { source: currentSource, provider: currentProvider, revealIndex: cursor });
        return;
      }

      // Exhausted the current batch — reroll never dead-ends on its own, so
      // fetch a fresh one (up to MAX_ALTERNATE_FETCHES total) and reveal
      // its first line the moment it lands, rather than making this click
      // just prime the pool for a second one.
      var sent = current;
      var leadShape = currentLeadShape;
      anotherBtn.disabled = true;
      await fetchMoreAlternates(sent, leadShape);
      if (sent !== current) return; // moved on to a new result while this was in flight
      if (cursor + 1 < pool.length) {
        cursor++;
        currentShape = pool[cursor].shape || null;
        resetReact();
        renderDraft(current, pool[cursor].text);
        logEvent("another", { source: currentSource, provider: currentProvider, revealIndex: cursor, fetch: alternateFetches });
        logEvent("draft_shown", { source: currentSource, provider: currentProvider, revealIndex: cursor });
      }
      refreshAnotherState();
    });

    // One tap on 😂/😐/😬, then the whole row greys out until the next draft
    // is shown (resetReact, called on initial render and on "another").
    // Never logs the draft text itself — only its shape, the tapped value,
    // and which of the (at most 3 visible) positions it was in.
    reactButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (reacted) return;
        reacted = true;
        reactButtons.forEach(function (b) { b.disabled = true; });
        btn.classList.add("picked");
        logEvent("rate", { shape: currentShape, value: btn.dataset.value, position: cursor + 1 });
      });
    });

    // Reveals .turn (the "write your own" box and its own share row) and
    // hides itself — a one-way expand, no need to collapse back once open.
    // Logs beat_open once per result, not once per (impossible, since the
    // link is gone after) tap.
    beatToggleEl.addEventListener("click", function () {
      turnEl.classList.remove("hidden");
      beatToggleEl.classList.add("hidden");
      if (!beatOpened) {
        beatOpened = true;
        logEvent("beat_open");
      }
      writeEl.focus({ preventScroll: true });
    });

    writeEl.addEventListener("input", function () {
      var hasText = writeEl.value.trim().length > 0;
      if (!ownLineLogged && hasText) {
        ownLineLogged = true;
        logEvent("own_line");
      }
    });

    // Share-as-image: a 9:16 PNG drawn on a client-side <canvas> — not a
    // screenshot of the page. Nothing but the wordmark, the exchange, and
    // the domain — no reactions, no buttons, no chrome. Sized 1080x1920,
    // the resolution "~24 characters per line" was calibrated against; the
    // body font size auto-shrinks (see drawShareCanvas) if a long sent
    // text plus continuation would still overflow the middle band at that
    // starting size.
    var SHARE_IMG_W = 1080;
    var SHARE_IMG_H = 1920;
    var SHARE_IMG_MARGIN = 90;
    var SHARE_IMG_BG = "#070707";
    var SHARE_IMG_FG = "#f4f1ea";
    var SHARE_IMG_MUTE = "#8a857c";
    var SHARE_IMG_RED = "#e23b2f";
    var SHARE_IMG_SERIF = "Georgia, 'Times New Roman', serif";
    var SHARE_IMG_SANS = "ui-sans-serif, system-ui, sans-serif";

    // Splits composeParts' {text, muted} parts into individual words, each
    // still tagged with its color — canvas has no equivalent of an inline
    // <span>, so word-by-word is how a color change mid-line gets drawn at
    // all. Whitespace inside a part collapses same as HTML's own would.
    function coloredWords(parts) {
      var words = [];
      parts.forEach(function (part) {
        var color = part.muted ? SHARE_IMG_MUTE : SHARE_IMG_FG;
        String(part.text).split(/\s+/).forEach(function (w) {
          if (w) words.push({ text: w, color: color });
        });
      });
      return words;
    }

    // Greedy word wrap against ctx's CURRENT font — caller sets ctx.font
    // before calling this. Returns an array of lines, each an array of the
    // {text, color} word tokens (see coloredWords) that landed on it.
    function wrapColoredWords(ctx, words, maxWidth) {
      var spaceWidth = ctx.measureText(" ").width;
      var lines = [];
      var line = [];
      var lineWidth = 0;
      words.forEach(function (word) {
        var w = ctx.measureText(word.text).width;
        var extra = line.length ? spaceWidth + w : w;
        if (line.length && lineWidth + extra > maxWidth) {
          lines.push(line);
          line = [word];
          lineWidth = w;
        } else {
          line.push(word);
          lineWidth += extra;
        }
      });
      if (line.length) lines.push(line);
      return lines;
    }

    function drawColoredLine(ctx, line, x, y) {
      var spaceWidth = ctx.measureText(" ").width;
      var cx = x;
      line.forEach(function (word) {
        ctx.fillStyle = word.color;
        ctx.fillText(word.text, cx, y);
        cx += ctx.measureText(word.text).width + spaceWidth;
      });
    }

    // Builds the actual <canvas> — sentText/draftText same as renderDraft
    // takes. Never touches the DOM (the canvas is never appended anywhere)
    // — the caller reads it back via canvas.toBlob.
    function drawShareCanvas(sentText, draftText) {
      var canvas = document.createElement("canvas");
      canvas.width = SHARE_IMG_W;
      canvas.height = SHARE_IMG_H;
      var ctx = canvas.getContext("2d");
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = SHARE_IMG_BG;
      ctx.fillRect(0, 0, SHARE_IMG_W, SHARE_IMG_H);

      var maxWidth = SHARE_IMG_W - SHARE_IMG_MARGIN * 2;

      // Wordmark, top — "almost sent" then a red period, same as h1.
      var wordmarkY = 200;
      ctx.font = "64px " + SHARE_IMG_SERIF;
      ctx.fillStyle = SHARE_IMG_FG;
      ctx.fillText("almost sent", SHARE_IMG_MARGIN, wordmarkY);
      var wordmarkWidth = ctx.measureText("almost sent").width;
      ctx.fillStyle = SHARE_IMG_RED;
      ctx.fillText(".", SHARE_IMG_MARGIN + wordmarkWidth, wordmarkY);

      // Middle: the composed exchange, wrapped, left-aligned, vertically
      // centered in the band between the wordmark and the footer. Starts
      // at 72px (tuned for ~24 characters/line at this margin) and shrinks
      // in 4px steps if a long sent text plus continuation would still
      // overflow the band, rather than ever running text off-canvas.
      var middleTop = 460;
      var middleBottom = SHARE_IMG_H - 220;
      var availableHeight = middleBottom - middleTop;
      var words = coloredWords(composeParts(sentText, draftText));
      var bodySize = 72;
      var lines, lineHeight, totalTextHeight;
      for (;;) {
        ctx.font = bodySize + "px " + SHARE_IMG_SERIF;
        lines = wrapColoredWords(ctx, words, maxWidth);
        lineHeight = Math.round(bodySize * 1.35);
        totalTextHeight = lines.length * lineHeight;
        if (totalTextHeight <= availableHeight || bodySize <= 36) break;
        bodySize -= 4;
      }
      ctx.font = bodySize + "px " + SHARE_IMG_SERIF;
      var startY = middleTop + Math.max(0, (availableHeight - totalTextHeight) / 2) + bodySize;
      lines.forEach(function (line, i) {
        drawColoredLine(ctx, line, SHARE_IMG_MARGIN, startY + i * lineHeight);
      });

      // Footer, bottom — muted, sans, small.
      ctx.font = "32px " + SHARE_IMG_SANS;
      ctx.fillStyle = SHARE_IMG_MUTE;
      ctx.fillText("almostsent.app", SHARE_IMG_MARGIN, SHARE_IMG_H - 100);

      return canvas;
    }

    // Wraps canvas.toBlob's callback shape in a promise — sentText/
    // draftText same as drawShareCanvas.
    function buildShareImageBlob(sentText, draftText) {
      return new Promise(function (resolve, reject) {
        try {
          var canvas = drawShareCanvas(sentText, draftText);
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error("toBlob returned nothing"));
          }, "image/png");
        } catch (err) {
          reject(err);
        }
      });
    }

    saveImageBtn.addEventListener("click", async function () {
      if (saveImageBtn.disabled) return;
      var draftText = (pool[cursor] && typeof pool[cursor].text === "string") ? pool[cursor].text : "";
      var label = saveImageBtn.textContent;
      saveImageBtn.disabled = true;
      saveImageBtn.textContent = "making it…";
      try {
        var blob = await buildShareImageBlob(current, draftText);
        logEvent("share", { via: "image" });
        var file = new File([blob], "almost-sent.png", { type: "image/png" });
        // The Instagram/Snapchat path — a mobile share sheet that can take
        // a file, not just a URL/text. navigator.canShare has to be asked
        // about THIS file specifically; some browsers implement share()
        // for text/url but not files, and canShare({files}) is what tells
        // the two apart.
        if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "almost-sent.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }
      } catch (err) {
        // A cancelled native share sheet throws too (AbortError) — not a
        // real failure, nothing here needs to interrupt anyone over it.
      } finally {
        saveImageBtn.disabled = false;
        saveImageBtn.textContent = label;
      }
    });

    // ?r=<device_id> makes this a referral link — see getDeviceId() above,
    // which logs an "arrival" event for whoever's first visit lands on it.
    // "i almost sent" only shows up when #write actually has something in
    // it — the share buttons work the moment a draft is on screen (see the
    // submit handler above), before anyone's typed their own line.
    function buildShareText() {
      var mine = writeEl.value.trim();
      var shareUrl = "https://almostsent.app/" + (DEVICE_ID ? "?r=" + encodeURIComponent(DEVICE_ID) : "");
      var text = "they sent: " + current + "\n" +
        "they almost sent: " + draftEl.textContent + "\n";
      if (mine) text += "i almost sent: " + current + mine + "\n";
      return text + "\n" + shareUrl;
    }

    // Both copies of each button (top row and the one under "write your
    // own") get the same listener — whichever one someone actually taps
    // does the exact same share.
    textShareBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        logEvent("share", { via: "sms" });
        whewEl.classList.remove("hidden");
        location.href = "sms:?&body=" + encodeURIComponent(buildShareText());
      });
    });

    emailShareBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        logEvent("share", { via: "email" });
        whewEl.classList.remove("hidden");
        location.href = "mailto:?subject=" + encodeURIComponent("almost sent") + "&body=" + encodeURIComponent(buildShareText());
      });
    });

    copyShareBtns.forEach(function (btn) {
      btn.addEventListener("click", async function () {
        logEvent("share", { via: "copy" });
        whewEl.classList.remove("hidden");
        try {
          await navigator.clipboard.writeText(buildShareText());
          // Only the button actually clicked relabels — the other copy
          // stays "copy it" until someone taps it too.
          btn.textContent = "copied.";
        } catch (err) { /* clipboard blocked — button just doesn't relabel */ }
      });
    });

    document.getElementById("again").addEventListener("click", reset);
  </script>
</body>
</html>
